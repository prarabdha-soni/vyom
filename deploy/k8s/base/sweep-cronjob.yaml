# The weekly literature sweep for every client tenant (fictional tenants are
# skipped). A failing tenant is recorded as an ops alert and the job exits 1.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vyom-weekly-sweep
  labels: { app.kubernetes.io/name: vyom-os, app.kubernetes.io/component: sweep }
spec:
  schedule: "30 2 * * 1"  # Mondays 02:30
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: { app.kubernetes.io/name: vyom-os, app.kubernetes.io/component: sweep }
        spec:
          serviceAccountName: vyom-os
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: cloud-sql-proxy
              image: cloud-sql-proxy
              restartPolicy: Always
              args: ["--private-ip", "--structured-logs", "--port=5432", "--health-check", "--http-address=0.0.0.0",
                     "--http-port=9090", "--exit-zero-on-sigterm", "$(CLOUDSQL_INSTANCE)"]
              env:
                - name: CLOUDSQL_INSTANCE
                  valueFrom: { configMapKeyRef: { name: vyom-os-config, key: CLOUDSQL_INSTANCE } }
              startupProbe:
                httpGet: { path: /startup, port: 9090 }
                periodSeconds: 1
                failureThreshold: 60
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 256Mi }
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          containers:
            - name: sweep
              image: vyom-os
              args: ["vyom-weekly-sweep"]
              envFrom:
                - configMapRef: { name: vyom-os-config }
                - secretRef: { name: vyom-os-secrets }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { memory: 1Gi }
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 128Mi }
