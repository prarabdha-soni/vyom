# Workload Identity: each Kubernetes service account acts as one Google
# service account (annotation set per overlay). The console has no Google access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyom-os
  annotations:
    iam.gke.io/gcp-service-account: vyom-os@YOUR_PROJECT.iam.gserviceaccount.com  # Cloud SQL client, Vertex AI user
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyom-migrate
  labels: { vyom/phase: migrate }
  annotations:
    iam.gke.io/gcp-service-account: vyom-migrate@YOUR_PROJECT.iam.gserviceaccount.com  # Cloud SQL client only
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyom-web
automountServiceAccountToken: false
