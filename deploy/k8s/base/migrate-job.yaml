# Applies pending schema migrations. Run before each release (RUNBOOK.md):
# it is idempotent, takes an advisory lock and each file is one transaction.
# `vyom/phase: migrate` marks everything this Job needs (its namespace,
# service account and config), so `kubectl apply -k … -l vyom/phase=migrate`
# can run it before the rest of a release.
apiVersion: batch/v1
kind: Job
metadata:
  name: vyom-migrate
  labels: { app.kubernetes.io/name: vyom-os, app.kubernetes.io/component: migrate, vyom/phase: migrate }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: vyom-os, app.kubernetes.io/component: migrate }
    spec:
      serviceAccountName: vyom-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: cloud-sql-proxy
          image: cloud-sql-proxy
          restartPolicy: Always
          args: ["--private-ip", "--structured-logs", "--port=5432", "--health-check", "--http-address=0.0.0.0",
                 "--http-port=9090", "--exit-zero-on-sigterm", "$(CLOUDSQL_INSTANCE)"]
          env:
            - name: CLOUDSQL_INSTANCE
              valueFrom: { configMapKeyRef: { name: vyom-os-config, key: CLOUDSQL_INSTANCE } }
          startupProbe:
            httpGet: { path: /startup, port: 9090 }
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: migrate
          image: vyom-os
          args: ["vyom-migrate"]
          envFrom:
            - configMapRef: { name: vyom-os-config }
            - secretRef: { name: vyom-migrate-secrets }  # MIGRATION_DATABASE_URL, VYOM_APP_DB_PASSWORD, VYOM_SERVICE_DB_PASSWORD
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
