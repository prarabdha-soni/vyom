# The whole Vyom stack on one machine: PostgreSQL 16, Vyom OS and the console.
#
#   cp deploy/.env.example deploy/.env      # then fill it in (see RUNBOOK.md)
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up --build -d
#   docker compose -f deploy/compose.yaml --env-file deploy/.env --profile demo run --rm seed
#
# Open http://localhost:3000/login/. Only the console is published, and only
# on 127.0.0.1; the API and the database stay on the internal network.
name: vyom

# The same restrictions as the GKE pods: read-only root, no capabilities, no
# privilege escalation, a non-root user (set in each image), and writable
# scratch space only where the manifests mount an emptyDir.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-os: &os
  <<: *hardened
  image: vyom-os:local
  build: ../vyom-os
  restart: "no"
  networks: [internal]
  tmpfs: ["/tmp:size=64m,uid=10001,gid=10001"]

x-os-env: &os-env
  # vyom_service bypasses row-level security (jobs, sign-in); vyom_app never does (requests).
  DATABASE_URL: postgresql://vyom_service:${VYOM_SERVICE_DB_PASSWORD:?set in deploy/.env}@postgres:5432/vyom
  APP_DATABASE_URL: postgresql://vyom_app:${VYOM_APP_DB_PASSWORD:?set in deploy/.env}@postgres:5432/vyom
  VYOM_SESSION_SECRET: ${VYOM_SESSION_SECRET:?set in deploy/.env}
  VYOM_AI_MODE: ${VYOM_AI_MODE:-demo}
  VYOM_TIMEZONE: ${VYOM_TIMEZONE:-Asia/Kolkata}
  NCBI_TOOL: ${NCBI_TOOL:-}
  NCBI_EMAIL: ${NCBI_EMAIL:-}
  NCBI_API_KEY: ${NCBI_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vyom"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Applies pending migrations and sets the application roles' passwords, then exits.
  migrate:
    <<: *os
    command: ["vyom-migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vyom
      VYOM_APP_DB_PASSWORD: ${VYOM_APP_DB_PASSWORD}
      VYOM_SERVICE_DB_PASSWORD: ${VYOM_SERVICE_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *os
    command: ["vyom-os-api"]
    restart: unless-stopped
    environment: *os-env
    # Outbound only (Vertex AI, PubMed in live mode); no port is published.
    networks: [internal, public]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    <<: *hardened
    image: vyom-web:local
    build: ../vyom-web
    restart: unless-stopped
    tmpfs:
      - "/tmp:size=64m,uid=10001,gid=10001"
      - "/app/.next/cache:size=256m,uid=10001,gid=10001"
    environment:
      VYOM_OS_URL: http://api:8000
      VYOM_SESSION_SECRET: ${VYOM_SESSION_SECRET}
      VYOM_SAMPLE_WORKSPACE: ${VYOM_SAMPLE_WORKSPACE:-on}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [internal, public]

  # Fictional demo-pharma tenant with sample work. Never run against a client database.
  seed:
    <<: *os
    profiles: [demo]
    command: ["vyom-seed-demo", "--confirm-fictional"]
    environment:
      <<: *os-env
      VYOM_DEMO_PASSWORD: ${VYOM_DEMO_PASSWORD:?set in deploy/.env}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The weekly literature sweep, on demand (the cluster runs it as a CronJob).
  sweep:
    <<: *os
    profiles: [jobs]
    command: ["vyom-weekly-sweep"]
    environment: *os-env
    networks: [internal, public]
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  internal:
    internal: true
  public: {}

volumes:
  postgres_data:
