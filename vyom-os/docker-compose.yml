services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  local_system_one:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a tested image digest}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      local_system_one:
        condition: service_started
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set URL-encoded DATABASE_URL for host postgres}
      LOCAL_SYS1_BASE_URL: http://local_system_one:11434/v1
      LOCAL_SYS2_BASE_URL: http://local_system_one:11434/v1
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

volumes:
  postgres_data:
  ollama_models: